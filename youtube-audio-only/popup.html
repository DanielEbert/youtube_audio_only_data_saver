<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 200px;
      padding: 12px;
      font-family: sans-serif;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }
    h3 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .active { background: #00e676; color: #000; }
    .disabled { background: #555; color: #fff; }
  </style>
</head>
<body>
  <h3>YouTube Audio</h3>
  <button id="toggleBtn">Toggle Mode</button>
  <script src="popup.js"></script>
</body>
</html>
